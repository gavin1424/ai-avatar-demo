<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>跟 AI 分身聊聊</title>
<meta name="theme-color" content="#1b1a19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Montserrat:wght@700;800&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<script src="data/site.js"></script>
<style>
/* 版面：真人數字人影片佔滿左側（手機佔滿全螢幕），對話在右側（手機疊在下方） */
:root{--main:#1f5fbf;--soft:#e7effb;--accent:#f2a33a;--paper:#fbf7f0;--paper2:#f3ece0;--ink:#2b2622;--mute:#6f665d;--line:#e6dccd;--card:#fffdf9;--hand:"LXGW WenKai TC","Noto Sans TC",serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit}
.room{display:grid;grid-template-columns:auto minmax(340px,440px);height:100dvh;justify-content:center;background:radial-gradient(80% 70% at 30% 40%,var(--soft),var(--paper) 75%)}
/* 舞台 */
.stage{position:relative;height:100dvh;aspect-ratio:3/4;max-width:calc(100vw - 340px);overflow:hidden;background:#cfd2d6 center/cover no-repeat}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;transition:opacity .3s}
/* 圖層：待機永遠鋪在最底層、不透明；思考 → 說話 → 招呼依序疊在上面淡入。
   換片時新的一段蓋在舊的上面淡入、舊的等蓋滿後才撤掉，任何時刻都不會露出背景（不會白閃）。 */
.stage .idle,.stage .think,.stage .talk,.stage .greet{opacity:0}
.stage .idle.on{opacity:1;z-index:1}
.stage .think{z-index:3}.stage .talk{z-index:5}.stage .greet{z-index:7}
.stage.thinking .think.on,.stage.speaking .talk.on,.stage.greeting .greet{opacity:1}
.stage.speaking .think.on,.stage.greeting .think.on{opacity:0}
/* 沒有影片時：照片輕微呼吸、說話時點頭 */
.stage.still{animation:breathe 5s ease-in-out infinite;transform-origin:50% 85%}
.stage.still.speaking{animation:breathe 5s ease-in-out infinite,nod 2.4s ease-in-out infinite}
@keyframes breathe{50%{scale:1.015}}
@keyframes nod{25%{rotate:.4deg}75%{rotate:-.4deg}}
.tag{position:absolute;z-index:20;top:max(12px,env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(20,18,16,.45);color:#fff;font-size:.8rem;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);text-decoration:none;cursor:pointer}
.tag.l{left:12px}.tag.r{right:12px}
.tag.r2{right:12px;top:calc(max(12px,env(safe-area-inset-top,0px)) + 40px)}
.state{position:absolute;z-index:20;left:50%;translate:-50% 0;top:max(14px,env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--main);color:#fff;font-size:.8rem;font-weight:700;opacity:0;transition:opacity .2s}
.state.on{opacity:1}
.state i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}
.cap{position:absolute;z-index:15;left:0;right:0;bottom:0;padding:70px 22px 26px;background:linear-gradient(0deg,rgba(15,13,11,.85) 40%,transparent);color:#fff;text-align:center;font-family:var(--hand);font-weight:700;font-size:clamp(1.15rem,2.5vh,1.6rem);line-height:1.55;text-shadow:0 1px 6px rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
.cap.on{opacity:1}
.cap .dim{color:rgba(255,255,255,.45)}
.name{position:absolute;z-index:15;left:16px;bottom:16px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);transition:opacity .25s}
.name b{display:block;font-size:1.3rem;font-weight:900;line-height:1.2}
.name span{font-size:.82rem;opacity:.9}
.cap.on~.name,.speaking .name{opacity:0}
/* 右側對話 */
.side{display:flex;flex-direction:column;min-height:0;background:var(--card);border-left:1px solid var(--line)}
.head{padding:18px 18px 10px;border-bottom:1px solid var(--line)}
.head b{font-size:1.15rem;font-weight:900}
.head p{margin:2px 0 0;color:var(--mute);font-size:.85rem}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:9px 14px;border-radius:18px;font-size:.93rem;line-height:1.6;animation:pop .3s ease}
.m.me{align-self:flex-end;background:var(--main);color:#fff;border-bottom-right-radius:6px}
.m.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:6px}
.m small{display:block;margin-top:3px;font-size:.72rem;color:var(--mute)}
.m small a{color:var(--mute)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.chips button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 13px;font-size:.86rem;color:var(--ink);cursor:pointer}
.chips button:hover{border-color:var(--main);color:var(--main)}
.input{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.input input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--paper);outline:none;color:var(--ink)}
.input input:focus{border-color:var(--main)}
.ib{flex:none;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--main);color:#fff}
.ib.mic{background:var(--paper2);color:var(--ink)}
.ib.mic.on{background:#e5484d;color:#fff;animation:pulse 1s infinite}
.heard{min-height:1.5em;padding:0 16px;font-size:.85rem;color:var(--main)}
.note{padding:0 16px 10px;font-size:.7rem;color:var(--mute);text-align:center;line-height:1.5}
/* 開始 */
.veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;align-content:center;gap:14px;border:0;width:100%;cursor:pointer;background:rgba(20,18,16,.35);backdrop-filter:blur(3px);color:#fff;text-align:center}
.veil b{font-family:var(--hand);font-size:clamp(1.6rem,5vw,2.3rem);text-shadow:0 2px 12px rgba(0,0,0,.5)}
.veil span{font-size:.9rem;opacity:.9}
.veil i{width:76px;height:76px;border-radius:50%;background:var(--main);display:grid;place-items:center;font-style:normal;font-size:2rem;box-shadow:0 0 0 0 color-mix(in srgb,var(--main) 60%,transparent);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 22px transparent}}
/* 手機與直立螢幕（含現場 43/55 吋直立機）：影片佔滿，對話疊在下方 */
@media (max-width:820px),(max-aspect-ratio:4/5){
  .room{display:block}
  .stage{position:absolute;inset:0;width:100%;height:100%;max-width:none;aspect-ratio:auto}
  .cap{bottom:var(--panel,190px);padding-bottom:10px;background:none;min-height:0}
  .name{bottom:calc(var(--panel,190px) + 8px)}
  /* 全身影片：整個人放進對話區上方，不裁腳 */
  /* 影片填滿對話區上方（只裁左右，保留整個人），下方接舞台地面色 */
  .stage:not(.still){background:linear-gradient(180deg,var(--soft) 0 8%,color-mix(in srgb,var(--soft) 35%,#fff) 60%)!important}
  /* 人物放大到剛好填滿「上方按鈕以下、對話區以上」：影片高 = 可用高度 × 1.27（人物佔影片 76%、頭上留 23%），左右多的背景裁掉 */
  .stage:not(.still) video{--hv:calc((100dvh - var(--panel,190px) + 24px - max(12px,env(safe-area-inset-top,0px)) - 40px) * 1.27);
    inset:auto;bottom:calc(var(--panel,190px) - 24px);left:50%;translate:-50% 0;height:var(--hv);width:max(100%,calc(var(--hv) * 2 / 3));object-fit:cover;object-position:center bottom}
  .stage:not(.still) .cap{color:var(--ink);text-shadow:0 0 8px #fff,0 0 3px #fff;background:linear-gradient(0deg,rgba(255,253,249,.92) 55%,transparent);padding-top:40px}
  .stage:not(.still) .cap .dim{color:rgba(43,38,34,.35)}
  .stage:not(.still) .name{color:var(--ink);text-shadow:0 0 6px #fff}
  .side{position:absolute;z-index:5;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(255,253,249,.97) 70%,rgba(255,253,249,0));border:0;padding-top:30px}
  .head,.log,.note{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;border:0;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none}
  .input{border:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--ink:#3d3652;--mute:#857d96;--grad:linear-gradient(120deg,#ff8a65,#ffb35c);--cream:#fffaf4;--line:#efe7de;--warm:#e98d63}
/* ===== 親切柔和介面：奶油白、粉嫩漸層、白色圓角卡片 ===== */
body{background:radial-gradient(700px 500px at 10% 0,#ffe6d6,transparent 60%),radial-gradient(700px 500px at 95% 10%,#ffeccc,transparent 60%),var(--cream);color:var(--ink)}
.room{background:none;position:relative;z-index:1}
#stars{display:none}
.stage{background-color:#fff7ef}
.side{background:rgba(255,255,255,.88);border-left:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink)}
.head{border-color:var(--line)}
.head b{font-size:1.1rem}
.head b::after{content:"AI 數字分身";margin-left:10px;font-size:.78rem;font-weight:500;color:var(--warm)}
.head p{color:var(--mute)}
.m.ai{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:20px 20px 20px 6px;box-shadow:0 6px 18px rgba(120,90,60,.08)}
.m.ai small,.m.ai small a{color:var(--mute)}
.m.me{background:var(--grad);color:#fff;border-radius:20px 20px 6px 20px}
.chips{border-color:var(--line)}
.chips button{background:#fff7f0;border:1px solid #f3e1d3;color:var(--ink);font-weight:500}
.chips button:hover{border-color:#ff9a6b;color:#d9643a}
.input{border-color:var(--line)}
.input input{background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:999px}
.input input::placeholder{color:#b3aabd}

.ib{background:var(--grad);box-shadow:0 8px 18px -8px rgba(255,138,101,.7)}
.ib.mic{background:#fff3ea;color:var(--ink);border:1px solid #f3e1d3;box-shadow:none}
.heard{color:#d9643a}
.note{color:var(--mute)}
.tag{background:rgba(255,255,255,.85);color:var(--ink);border:1px solid var(--line);backdrop-filter:blur(6px)}
.state{background:var(--grad)}
.veil{background:radial-gradient(600px 400px at 20% 10%,rgba(255,214,186,.55),transparent 60%),rgba(255,250,244,.82);color:var(--ink)}
.veil i{background:var(--grad);box-shadow:0 0 0 0 rgba(255,138,101,.5)}
.veil b{font-family:"Noto Sans TC",sans-serif;font-weight:900;color:var(--ink);text-shadow:none}
.veil span{color:var(--mute)}
.veil small{display:block;font-family:"Noto Sans TC",sans-serif;font-weight:700;letter-spacing:.12em;color:var(--warm);font-size:.85rem}
.cap{left:16px;right:16px;bottom:18px;padding:14px 18px 16px;border-radius:22px;background:rgba(255,255,255,.92);border:1px solid var(--line);
  font-family:"Noto Sans TC",sans-serif;font-weight:500;font-size:clamp(1rem,2.2vh,1.25rem);text-align:left;text-shadow:none;color:var(--ink);box-shadow:0 12px 30px rgba(120,90,60,.12)}
.cap::before{content:attr(data-who);display:block;margin-bottom:6px;font-size:.82rem;font-weight:700;color:var(--warm)}
.cap .dim{color:#c3bacb}
.name{display:none}
@media (max-width:820px),(max-aspect-ratio:4/5){
  .stage:not(.still){background:linear-gradient(180deg,#fff3ea,#f1f4ff 60%,#fbf7f2)!important}
  .side{background:linear-gradient(0deg,rgba(255,250,244,.98) 72%,rgba(255,250,244,0));border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  .stage:not(.still) .cap{bottom:calc(var(--panel,190px) - 6px);left:12px;right:12px;padding:12px 16px 14px;background:rgba(255,255,255,.94);color:var(--ink);text-shadow:none}
  .stage:not(.still) .cap .dim{color:#c3bacb}
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="room">
  <div class="stage" id="stage">
    <video class="idle" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="idle" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="think" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="think" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="talk" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="talk" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="greet" id="vGreet" muted playsinline preload="auto" aria-hidden="true"></video>
    <a class="tag l" href="index.html">← 首頁</a>
    <span class="tag r" id="aiTag">AI 生成・經本人授權</span>
    <button type="button" class="tag r2" id="fsBtn">⛶ 全螢幕</button>
    <div class="state" id="state"><i></i><span></span></div>
    <div class="cap" id="cap" aria-live="polite"></div>
    <div class="name"><b id="nm"></b><span id="tt"></span></div>
  </div>
  <aside class="side" id="side">
    <div class="head"><b id="hd"></b><p>直接開口問，或點下面的問題。</p></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="heard" id="heard"></div>
    <div class="chips" id="chips"></div>
    <form class="input" id="form">
      <button type="button" class="ib mic" id="mic" aria-label="用說的"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <input id="q" placeholder="想問什麼都可以…" autocomplete="off" enterkeyhint="send">
      <button class="ib" aria-label="送出"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <div class="note" id="note"></div>
  </aside>
</div>
<button type="button" class="veil" id="veil"><i>👋</i><b id="veilT">點一下，開始聊天</b><span>會有聲音，請開啟喇叭</span></button>
<audio id="au" preload="auto"></audio>

<script>
// 流程：開場白 → 題庫固定回答（預錄語音）→ 題庫沒有的問 AI API → API 不在線就轉介服務處
// 畫面：待機影片循環；說話時切到說話影片；開場先播打招呼影片。沒有影片時用照片。
// 現場直立螢幕可加 ?kiosk=1：說完自動再聽（免按麥克風）。
(() => {
const S = window.SITE, C = S.candidate, A = S.avatar || {}, $ = s => document.querySelector(s);
for (const [k, v] of Object.entries(C.colors || {})) document.documentElement.style.setProperty("--" + k, v);
document.title = `跟 ${C.name} 的 AI 分身聊聊`;
$("#nm").textContent = C.name; $("#tt").textContent = C.title; $("#hd").textContent = `跟 ${C.name} 的 AI 分身聊聊`;
$("#veilT").textContent = `點一下，跟${C.name}聊聊`; $("#note").textContent = S.disclose;
$("#cap").dataset.who = `${C.name}｜AI 數字分身`;
$("#veilT").insertAdjacentHTML("beforebegin", "<small>AI 數字分身</small>");
/* 背景星點（參考 lumiava 的粒子感，輕量） */
(() => { const cv = $("#stars"), x = cv.getContext("2d"); let P = [];
  const size = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    P = Array.from({ length: 70 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: (Math.random() * 1.4 + .4) * devicePixelRatio, v: Math.random() * .25 + .05, a: Math.random() })); };
  size(); addEventListener("resize", size);
  const tick = () => { x.clearRect(0, 0, cv.width, cv.height);
    for (const p of P) { p.y -= p.v * devicePixelRatio; p.a += .02; if (p.y < 0) p.y = cv.height;
      x.globalAlpha = .35 + .35 * Math.sin(p.a); x.fillStyle = "#fff"; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); }
    requestAnimationFrame(tick); };
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) tick(); })();
if (S.demo) $("#aiTag").textContent = "AI 虛擬人物・產品示範";

const stage = $("#stage"), vGreet = $("#vGreet"), au = $("#au"), cap = $("#cap"), log = $("#log");
stage.style.backgroundImage = `url(${A.bg || A.poster || C.photo})`;
if (A.bg) stage.style.setProperty("--stagebg", `url(${A.bg})`);   // 手機版影片周圍也用同一張舞台背景
const list = v => (Array.isArray(v) ? v : v ? [v] : []);
const IDLE = list(A.idle), TALK = list(A.talk), THINK = list(A.think);

/* 影片輪播：兩個播放器交替，一段播完先把下一段在背後備好再切過去 */
function deck(cls, clips, pick) {
  const vs = [...stage.querySelectorAll("video." + cls)];
  if (!clips.length) { vs.forEach(v => v.remove()); return null; }
  let cur = 0, last = -1, running = false;
  const next = () => { const i = pick(last); last = i; return clips[i]; };
  // 等下一段影片真的畫出第一格再切換，避免切換瞬間露出空白或底圖（一閃一閃）
  const ready = v => new Promise(r => { let done = false; const ok = () => { if (!done) { done = true; r(); } };
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(ok); setTimeout(ok, v.requestVideoFrameCallback ? 300 : 80); });
  const base = { idle: 1, think: 3, talk: 5 }[cls] || 1;
  const swap = () => {
    const v = vs[cur], nx = vs[1 - cur]; nx.currentTime = 0;
    return nx.play().then(() => ready(nx)).then(() => {
      nx.style.zIndex = base + 1; v.style.zIndex = base;                 // 新的蓋在舊的上面
      nx.classList.add("on"); cur = 1 - cur;
      setTimeout(() => { v.classList.remove("on"); v.pause(); v.src = next(); v.load(); }, 450);   // 新的淡入蓋滿後才撤掉舊的
    }).catch(() => { v.currentTime = 0; return v.play().catch(() => {}); });
  };
  vs.forEach(v => { v.loop = clips.length === 1; });
  if (cls === "idle") vs[0].poster = A.poster || "";
  vs[0].src = next(); vs[0].classList.add("on");
  if (clips.length > 1) { vs[1].src = next(); vs[1].load(); }
  vs.forEach((v, i) => v.onended = () => { if (i === cur && running) swap(); });
  return {
    start(fresh) {                                       // 回傳 Promise：畫面備妥時完成
      running = true; const v = vs[cur];
      if (fresh && clips.length > 1) return swap();      // 每次開口換一種動作
      if (fresh) v.currentTime = 0;
      return v.play().then(() => ready(v)).catch(() => {});
    },
    stop() { running = false; const v = vs[cur]; setTimeout(() => { if (!running) v.pause(); }, 350); },
  };
}
// 待機：大多數時間播第一段，偶爾穿插其他待機動作；說話：隨機挑不重複的一段
const idleDeck = deck("idle", IDLE, last => (IDLE.length < 2 ? 0 : last !== 0 || Math.random() < .55 ? 0 : 1 + Math.floor(Math.random() * (IDLE.length - 1))));
const thinkDeck = deck("think", THINK, last => (THINK.length < 2 ? 0 : (last + 1) % THINK.length));
const talkDeck = deck("talk", TALK, last => { if (TALK.length < 2) return 0; let i; do i = Math.floor(Math.random() * TALK.length); while (i === last); return i; });
if (!idleDeck) stage.classList.add("still");
if (A.greet) vGreet.src = A.greet; else vGreet.remove();
idleDeck?.start();

const P = new URLSearchParams(location.search), KIOSK = P.has("kiosk");
let turn = 0, hist = [];
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const setState = t => { $("#state").classList.toggle("on", !!t); $("#state span").textContent = t || ""; };
const add = (cls, html) => { const d = document.createElement("div"); d.className = "m " + cls; d.innerHTML = html; log.append(d); log.scrollTop = log.scrollHeight; };
const srcLink = u => u ? `<small><a href="${u}" target="_blank" rel="noopener">資料來源</a></small>` : "";

/* 影片狀態 */
let thinkTok = 0;
function thinking(on) {   // 等 AI 回答時：閉嘴思考的動作（沒有思考影片就維持待機）
  const tok = ++thinkTok;
  if (!on) { stage.classList.remove("thinking"); thinkDeck?.stop(); return; }
  if (!thinkDeck) return;
  thinkDeck.start(true).then(() => { if (tok === thinkTok) stage.classList.add("thinking"); });
}
let speakTok = 0;
function speaking(on) {   // 每段新回答開口時都換一種動作；說話影片備妥才切過去
  const tok = ++speakTok;
  if (on) thinking(false);
  if (!talkDeck || !on) { stage.classList.toggle("speaking", on); if (!on) talkDeck?.stop(); return; }
  talkDeck.start(true).then(() => { if (tok === speakTok) stage.classList.add("speaking"); });
}
function greet() {   // 打招呼影片播一次（沒有就跳過）
  if (!A.greet) return Promise.resolve();
  return new Promise(res => { stage.classList.add("greeting"); vGreet.currentTime = 0;
    const done = () => { stage.classList.remove("greeting"); res(); };
    vGreet.onended = done; vGreet.play().catch(done); setTimeout(done, 11000); });
}

/* 字幕跟著聲音進度跑 */
function caption(text, prog, part) {
  const chars = [...text], my = turn; cap.classList.add("on");
  return new Promise(res => { (function step() {
    if (my !== turn) return res();
    const p = prog(); if (p === null) { if (!part) cap.textContent = text; return res(); }
    const n = Math.round(chars.length * Math.min(1, p));
    cap.innerHTML = esc(chars.slice(0, n).join("")) + `<span class="dim">${esc(chars.slice(n).join(""))}</span>`;
    requestAnimationFrame(step); })(); });
}
async function playFile(url, text) {
  const my = turn; au.src = url; speaking(true); setState("說話中");
  try { await au.play(); } catch { if (my === turn) speaking(false); return my !== turn; }
  await caption(text, () => au.ended || au.paused ? null : (au.duration ? au.currentTime / au.duration : 0));
  if (my === turn) { speaking(false); setState(""); } return true;
}
function speakBrowser(text) {   // 沒有語音檔時改用瀏覽器內建語音
  return new Promise(res => {
    if (!("speechSynthesis" in window)) { cap.textContent = text; cap.classList.add("on"); return res(); }
    const u = new SpeechSynthesisUtterance(text), my = turn; u.lang = "zh-TW";
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)); if (v) u.voice = v;
    let i = 0; const chars = [...text]; u.onboundary = e => { i = e.charIndex; };
    speaking(true); setState("說話中"); cap.classList.add("on");
    const t = setInterval(() => cap.innerHTML = esc(chars.slice(0, i + 1).join("")) + `<span class="dim">${esc(chars.slice(i + 1).join(""))}</span>`, 80);
    u.onend = u.onerror = () => { clearInterval(t); if (my === turn) { cap.textContent = text; speaking(false); setState(""); } res(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  });
}
/* AI 回答：拆成句子同時請伺服器配音，第一句好了就開口，字幕依全文進度跑 */
async function sayChunks(text, stale) {
  const parts = []; let buf = "";
  for (const seg of text.split(/(?<=[，。！？!?；])/)) { buf += seg; if ([...buf].length >= (parts.length ? 16 : 6)) { parts.push(buf); buf = ""; } }   // 第一段短一點，早點開口
  if (buf) parts.length ? (parts[parts.length - 1] += buf) : parts.push(buf);
  const audios = parts.map(p => fetch("api/tts?text=" + encodeURIComponent(p)).then(r => r.ok ? r.blob() : null).catch(() => null));
  const total = [...text].length, my = turn; let done = 0, started = false;
  for (let i = 0; i < parts.length; i++) {
    const b = await audios[i]; if (stale()) return;
    if (!b) { thinking(false); return speakBrowser(parts.slice(i).join("")); }
    au.src = URL.createObjectURL(b);
    if (!started) { started = true; speaking(true); setState("說話中"); }
    try { await au.play(); } catch { break; }
    const n = [...parts[i]].length, before = done;
    await caption(text, () => au.ended ? null : (before + (au.duration ? au.currentTime / au.duration : 0) * n) / total, true);
    done += n; URL.revokeObjectURL(au.src);
    if (stale()) return;
  }
  if (my === turn) { cap.textContent = text; speaking(false); setState(""); }
}
async function say(url, text, stale) { const ok = await playFile(url, text); if (!ok && !stale()) await speakBrowser(text); }

/* 1. 題庫比對 */
const norm = s => s.toLowerCase().replace(/[\s，。？！、,.?!「」『』：:；;~～]/g, "");
function match(text) {
  const t = norm(text); let best = null, top = 0;
  for (const it of S.qa) {
    let s = 0;
    for (const k of it.keys || []) if (k && t.includes(norm(k))) s += norm(k).length * 2 + 1;
    if (norm(it.q) === t) s += 100;
    else { const q = norm(it.q); let c = 0; for (const ch of new Set(t)) if (q.includes(ch)) c++; s += c / Math.max(4, new Set(t).size) * 4; }
    if (s > top) { top = s; best = it; }
  }
  return top >= 7 ? best : null;
}

async function ask(text, preset) {
  text = text.trim(); if (!text) return;
  const my = ++turn, stale = () => my !== turn;
  au.pause(); speechSynthesis?.cancel?.(); if (rec) rec.abort();
  speaking(false); thinking(false); setState("");    // 被新問題打斷：上一段的說話／思考動作立刻停
  add("me", esc(text)); $("#heard").textContent = "";
  const it = preset || match(text);
  if (it) {                                         // 題庫固定回答
    add("ai", esc(it.a) + srcLink(it.source_url));
    await say(`audio/qa/${it.id}.mp3`, it.a, stale); hist.push([text, it.a]);
  } else {                                           // 2. 題庫沒有 → 問 AI
    setState("想一下"); thinking(true); cap.innerHTML = '<span class="dim">讓我想一下…</span>'; cap.classList.add("on");
    let ans = null;
    try { const r = await fetch("api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: text, history: hist.slice(-4) }) });
      if (r.ok) ans = (await r.json()).answer; } catch {}
    if (stale()) { return; }
    if (ans) { add("ai", esc(ans) + "<small>AI 依公開資料即時生成</small>"); await sayChunks(ans, stale); hist.push([text, ans]); }
    else { add("ai", esc(S.fallback)); await say("audio/fallback.mp3", S.fallback, stale); }   // 3. 轉介服務處
  }
  if (stale()) return;
  setState(""); setTimeout(() => { if (!stale()) cap.classList.remove("on"); }, 2500);
  if (KIOSK) setTimeout(() => { if (!stale()) listen(); }, 700);
}

/* 常見問題、打字 */
$("#chips").innerHTML = S.qa.filter(q => q.chip).map(q => `<button type="button" data-id="${q.id}">${esc(q.q)}</button>`).join("");
$("#chips").onclick = e => { const b = e.target.closest("button"); if (b) { const it = S.qa.find(q => q.id === b.dataset.id); ask(it.q, it); } };
$("#form").onsubmit = e => { e.preventDefault(); const v = $("#q").value; $("#q").value = ""; ask(v); };

/* 麥克風：按一下說話；kiosk 模式說完自動再聽 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $("#mic").hidden = true;
let rec = null;
function listen() {
  if (!SR || rec || stage.classList.contains("speaking")) return;
  rec = new SR(); rec.lang = "zh-TW"; rec.interimResults = true;
  $("#mic").classList.add("on"); setState("我在聽");
  let heard = "";
  rec.onresult = e => { heard = [...e.results].map(r => r[0].transcript).join(""); $("#heard").textContent = "你說：" + heard; };
  rec.onerror = e => { if (/not-allowed|audio-capture/.test(e.error)) { $("#heard").textContent = "麥克風沒有權限，可以改用打字。"; } };
  rec.onend = () => { rec = null; $("#mic").classList.remove("on"); setState("");
    if (heard.trim()) ask(heard); else if (KIOSK) setTimeout(listen, 400); };
  try { rec.start(); } catch { rec = null; }
}
$("#mic").onclick = () => { if (rec) rec.stop(); else { au.pause(); turn++; speaking(false); listen(); } };

/* 全螢幕（現場機台） */
$("#fsBtn").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});
if (!document.documentElement.requestFullscreen) $("#fsBtn").hidden = true;
new ResizeObserver(() => document.body.style.setProperty("--panel", $("#side").offsetHeight + "px")).observe($("#side"));

/* 開場：打招呼 → 開場白 → 預設問題 */
$("#veil").onclick = async () => {
  $("#veil").remove(); idleDeck?.start();
  const my = turn;
  await greet(); if (my !== turn) return;
  add("ai", esc(S.opening));
  await say("audio/opening.mp3", S.opening, () => my !== turn);
  if (my !== turn) return;
  setTimeout(() => { if (my === turn) cap.classList.remove("on"); }, 2500);
  if (P.get("q")) { const it = S.qa.find(q => q.id === P.get("q")); if (it) return ask(it.q, it); }
  if (P.get("ask")) return ask(P.get("ask"));
  if (KIOSK) listen();
};

/* 現場機台：沒人互動 40 秒就揮手招呼路過的人 */
let quietSince = Date.now();
["pointerdown", "keydown"].forEach(t => addEventListener(t, () => quietSince = Date.now()));
if (KIOSK && A.greet) setInterval(() => {
  const busy = stage.classList.contains("speaking") || stage.classList.contains("greeting") || rec || $("#veil");
  if (busy) quietSince = Date.now(); else if (Date.now() - quietSince > 40000) { quietSince = Date.now(); greet(); }
}, 2000);
})();
</script>
