<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>競選網站</title>
<meta name="theme-color" content="#fbf7f0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<script src="data/site.js"></script>
<style>
:root{
  --main:#1f5fbf; --soft:#e7effb; --accent:#f2a33a;
  --paper:#fbf7f0; --paper2:#f3ece0; --ink:#2b2622; --mute:#6f665d; --line:#e6dccd; --card:#fffdf9;
  --sans:"Noto Sans TC",system-ui,sans-serif; --hand:"LXGW WenKai TC","Noto Sans TC",serif;
  --gut:max(16px,env(safe-area-inset-left,0px)); color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.8;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.wrap{max-width:1140px;margin:0 auto;padding-inline:var(--gut)}
.hand{font-family:var(--hand)}
h2{font-size:clamp(1.9rem,4.4vw,2.9rem);line-height:1.3;margin:.2em 0 .5em;font-weight:900;text-wrap:balance}
.kicker{font-family:var(--hand);color:var(--main);font-size:1.15rem;font-weight:700}
.lead{color:var(--mute);font-size:1.05rem;max-width:36em}
.sec{padding-block:clamp(70px,10vw,120px)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.mark{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 45%,transparent) 62%);padding:0 .1em}

/* nav */
.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.solid{border-color:var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.05rem}
.brand .no{min-width:34px;height:34px;padding:0 8px;border-radius:50%;display:grid;place-items:center;background:var(--main);color:#fff;font-size:1rem}
.nav ul{display:flex;gap:26px;list-style:none;margin:0 0 0 auto;padding:0;color:var(--mute);font-size:.95rem}
.nav ul a:hover{color:var(--main)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 24px;font-weight:700;white-space:nowrap;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn-main{background:var(--main);color:#fff;box-shadow:0 8px 22px -8px color-mix(in srgb,var(--main) 70%,transparent)}
.btn-line{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.nav .btn{padding:9px 18px;font-size:.9rem}
@media(max-width:860px){.nav ul{display:none}.nav .btn{margin-left:auto}}

/* hero */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-12vw;top:-10vw;width:62vw;height:62vw;max-width:820px;max-height:820px;border-radius:50%;background:var(--soft)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,64px);align-items:center;padding-block:clamp(40px,6vw,70px) clamp(60px,8vw,90px)}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 16px 6px 6px;font-size:.92rem;color:var(--mute)}
.badge b{background:var(--main);color:#fff;border-radius:999px;padding:2px 12px;font-size:.85rem}
.hello{font-family:var(--hand);font-size:clamp(1.3rem,2.4vw,1.6rem);margin:22px 0 0;color:var(--mute)}
.hname{font-size:clamp(3.4rem,9vw,6.4rem);font-weight:900;line-height:1.05;margin:4px 0 0;letter-spacing:.06em;position:relative;display:inline-block}
.hname svg{position:absolute;left:-2%;bottom:-.18em;width:104%;height:.36em;overflow:visible}
.hname svg path{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.htitle{margin:22px 0 0;font-weight:700;color:var(--main)}
.slogan{font-family:var(--hand);font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:700;line-height:1.45;margin:18px 0 14px;white-space:pre-line}
.hsub{color:var(--mute);max-width:30em;margin:0 0 30px}
.hcta{display:flex;flex-wrap:wrap;gap:12px}
.photo{position:relative;justify-self:center;width:min(100%,440px)}
.photo .frame{aspect-ratio:4/5;border-radius:220px 220px 32px 32px;overflow:hidden;background:var(--paper2);border:8px solid #fff;box-shadow:0 30px 60px -30px rgba(60,40,20,.45)}
.photo .frame img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.sticker{position:absolute;background:#fff;border-radius:18px;padding:10px 16px;box-shadow:0 12px 30px -12px rgba(60,40,20,.35);font-size:.9rem;line-height:1.45;animation:bob 5s ease-in-out infinite}
.sticker b{display:block;font-size:1.25rem;color:var(--main)}
.s1{left:-8%;top:16%;transform:rotate(-4deg)}
.s2{right:-6%;bottom:14%;transform:rotate(3deg);animation-delay:-2.5s}
.s2 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#33c26b;margin-right:6px;animation:pulse 1.6s infinite}
@keyframes bob{50%{translate:0 -8px}}
@keyframes pulse{50%{opacity:.3}}
.cap{margin-top:12px;text-align:center;font-size:.75rem;color:var(--mute)}
.count{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:30px;font-size:.95rem;color:var(--mute)}
.count span{white-space:nowrap}.count b{font-size:1.6rem;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:900}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-top:24px}.photo{order:-1;width:min(66%,270px);margin-top:4px}.s1{left:-10%}.s2{right:-8%}}

/* talk band */
.talkband{background:var(--main);color:#fff;border-radius:32px;padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:auto 1fr auto;gap:clamp(18px,4vw,40px);align-items:center;position:relative;overflow:hidden}
.talkband::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.talkband .av{width:110px;height:110px;border-radius:50%;overflow:hidden;border:4px solid rgba(255,255,255,.7);position:relative}
.talkband .av img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.talkband h3{margin:0;font-size:clamp(1.4rem,3vw,2rem);font-weight:900}
.talkband p{margin:6px 0 0;opacity:.85}
.talkband .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.talkband .chips a{background:rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-size:.88rem}
.talkband .chips a:hover{background:rgba(255,255,255,.28)}
.talkband .btn{background:#fff;color:var(--main);position:relative;z-index:1}
@media(max-width:860px){.talkband{grid-template-columns:1fr;text-align:center;justify-items:center}.talkband .chips{justify-content:center}}

/* achievements */
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px}
.acard{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:26px 24px 22px;position:relative;transition:transform .3s,box-shadow .3s}
.acard:nth-child(3n+1){rotate:-.6deg}.acard:nth-child(3n+3){rotate:.6deg}
.acard:hover{transform:translateY(-6px) rotate(0);box-shadow:0 22px 40px -24px rgba(60,40,20,.4)}
.acard .tag{display:inline-block;font-size:.8rem;font-weight:700;color:var(--main);background:var(--soft);border-radius:8px;padding:2px 10px}
.acard .kind{float:right;font-family:var(--hand);font-size:.85rem;color:var(--accent);font-weight:700}
.acard h3{font-size:1.3rem;margin:12px 0 8px;font-weight:900}
.acard p{margin:0;color:var(--mute);font-size:.95rem}
.acard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:.82rem}
.acard .foot a{color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.acard .foot button{background:none;border:0;color:var(--main);font-weight:700;padding:0}
@media(max-width:960px){.agrid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.agrid{grid-template-columns:1fr}.acard{rotate:0deg!important}}

/* timeline */
.story{background:var(--paper2)}
.tl{display:grid;gap:0;margin-top:30px;position:relative;max-width:760px}
.tl::before{content:"";position:absolute;left:62px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px)}
.tli{display:grid;grid-template-columns:52px 1fr;gap:34px;padding:14px 0;position:relative}
.tli .y{font-weight:900;color:var(--main);font-size:1.1rem;text-align:right}
.tli::after{content:"";position:absolute;left:56px;top:24px;width:14px;height:14px;border-radius:50%;background:var(--paper2);border:3px solid var(--main)}
.tli h4{margin:0;font-size:1.12rem}
.tli p{margin:2px 0 0;color:var(--mute);font-size:.95rem}

/* footer */
footer{padding:50px 0 calc(40px + env(safe-area-inset-bottom,0px));font-size:.88rem;color:var(--mute)}
footer .cols{display:grid;grid-template-columns:1.2fr 1fr;gap:30px}
footer h5{margin:0 0 8px;font-size:1rem;color:var(--ink)}
footer ol{margin:0;padding-left:1.2em;font-size:.8rem;word-break:break-all}
.legal{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:.8rem}
@media(max-width:760px){footer .cols{grid-template-columns:1fr}}

/* floating talk button */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 18px 6px 6px;box-shadow:0 14px 34px -14px rgba(60,40,20,.5);font-weight:700}
.fab img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:center 15%}
.fab span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#33c26b;margin-right:6px;vertical-align:1px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.hname svg path{stroke-dashoffset:0}}
</style>
</head>
<body>
<nav class="nav" id="nav"><div class="wrap">
  <a class="brand" href="#top"><span class="no" id="navNo"></span><span data-f="name"></span></a>
  <ul><li><a href="#done">做到的事</a></li><li><a href="#story">一路走來</a></li><li><a href="talk.html">跟我聊聊</a></li></ul>
  <a class="btn btn-main" href="talk.html">跟 AI 分身聊聊</a>
</div></nav>

<main id="top">
<section class="hero"><div class="wrap">
  <div>
    <span class="badge"><b id="partyB"></b><span data-f="title"></span></span>
    <p class="hello">大家好，我是</p>
    <h1 class="hname"><span data-f="name"></span><svg viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true"><path d="M4 14 C 80 4, 180 4, 296 12"/></svg></h1>
    <p class="slogan" data-f="slogan"></p>
    <p class="hsub" data-f="sub"></p>
    <div class="hcta"><a class="btn btn-main" href="talk.html">🎙️ 直接問我</a><a class="btn btn-line" href="#done">看我做了什麼 →</a></div>
    <div class="count" id="count"></div>
  </div>
  <div class="photo rv">
    <div class="frame"><img id="photo" alt=""></div>
    <div class="sticker s1"><b id="stat1"></b><span id="stat1l"></span></div>
    <div class="sticker s2"><span class="dot"></span>AI 分身 24 小時在線</div>
    <div class="cap" id="photoCap"></div>
  </div>
</div></section>

<div class="wrap"><div class="talkband rv">
  <div class="av"><img id="bandImg" alt=""></div>
  <div><h3>有問題？直接問我的 AI 分身</h3><p>用說的或用打的都可以，回答都根據公開的施政與政見資料。</p><div class="chips" id="bandChips"></div></div>
  <a class="btn" href="talk.html">開始聊天 →</a>
</div></div>

<section class="sec" id="done"><div class="wrap">
  <div class="rv"><div class="kicker">說到做到</div><h2>這些事，<span class="mark">我一件一件做</span>。</h2><p class="lead">每一項都附上公開資料來源。想多了解哪一項，按「問問我」就好。</p></div>
  <div class="agrid" id="agrid"></div>
</div></section>

<section class="sec story" id="story"><div class="wrap">
  <div class="rv"><div class="kicker">一路走來</div><h2>我的故事</h2></div>
  <div class="tl" id="tl"></div>
</div></section>
</main>

<footer><div class="wrap">
  <div class="cols">
    <div><h5>關於這個網站</h5><p id="disclose"></p><p id="contact"></p></div>
    <div><h5>資料來源</h5><ol id="sources"></ol></div>
  </div>
  <div class="legal"><span id="copy"></span><span>網站與 AI 分身製作：<span data-f="company"></span></span></div>
</div></footer>

<a class="fab" href="talk.html"><img id="fabImg" alt=""><span>跟我聊聊</span></a>

<script>
(() => {
const S = window.SITE, C = S.candidate, $ = s => document.querySelector(s);
const r = document.documentElement.style;
for (const [k, v] of Object.entries(C.colors || {})) r.setProperty("--" + k, v);
const F = { ...C, company: S.company };
document.querySelectorAll("[data-f]").forEach(el => el.textContent = F[el.dataset.f] ?? "");
document.title = `${C.name}｜${C.title}`;
$("#navNo").textContent = C.number ?? C.name.slice(0, 1);
$("#partyB").textContent = C.number ? `${C.number} 號` : (C.party || "");
for (const id of ["#photo", "#bandImg", "#fabImg"]) { $(id).src = C.photo; $(id).alt = C.name; }
$("#photoCap").textContent = C.photoCredit ? "照片：" + C.photoCredit : "";
const st = S.stat || {}; $("#stat1").textContent = st.value || ""; $("#stat1l").textContent = st.label || "";
if (!st.value) $(".s1").remove();
$("#disclose").textContent = S.disclose;
$("#contact").textContent = S.contact || "";
$("#copy").textContent = `© ${new Date().getFullYear()} ${C.name}`;

/* 示範模式：頂端常駐說明「虛擬人物」，不做投票倒數 */
if (S.demo) {
  const b = document.createElement("div");
  b.textContent = S.demoBanner; b.style.cssText = "position:sticky;top:0;z-index:99;background:#2b2622;color:#fff;text-align:center;font-size:.85rem;padding:7px 12px;line-height:1.5";
  document.body.prepend(b);
}
/* countdown */
const tgt = new Date(S.electionDate).getTime();
const tick = () => { const d = Math.max(0, tgt - Date.now()) / 1000;
  $("#count").innerHTML = `<span>距離投票日還有</span><span><b>${Math.floor(d / 86400)}</b> 天 <b>${Math.floor(d % 86400 / 3600)}</b> 小時</span><span>記得回家投票 🗳️</span>`; };
if (S.demo) $("#count").remove(); else { tick(); setInterval(tick, 30000); }

/* chips */
$("#bandChips").innerHTML = S.qa.filter(q => q.chip).slice(0, 4).map(q => `<a href="talk.html?q=${encodeURIComponent(q.id)}">${q.q}</a>`).join("");

/* achievements + sources */
const src = [];
const cite = u => { if (!u) return ""; let i = src.indexOf(u); if (i < 0) { src.push(u); i = src.length - 1; } return `<a href="${u}" target="_blank" rel="noopener">資料來源 ${i + 1}</a>`; };
$("#agrid").innerHTML = S.achievements.map(a => `<article class="acard rv">
  <span class="tag">${a.tag}</span>${a.kind ? `<span class="kind">${a.kind}</span>` : ""}
  <h3>${a.title}</h3><p>${a.text}</p>
  <div class="foot">${cite(a.source_url)}<button data-ask="${a.title}">問問我 →</button></div></article>`).join("");
$("#tl").innerHTML = S.timeline.map(t => `<div class="tli rv"><div class="y">${t.year}</div><div><h4>${t.title}</h4><p>${t.text}</p></div></div>`).join("");
S.qa.forEach(q => cite(q.source_url));
$("#sources").innerHTML = src.map(u => `<li><a href="${u}" target="_blank" rel="noopener">${u}</a></li>`).join("");
document.addEventListener("click", e => { const b = e.target.closest("[data-ask]"); if (b) location.href = "talk.html?ask=" + encodeURIComponent(b.dataset.ask + "，可以多說一點嗎？"); });

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll(".rv").forEach(el => io.observe(el));
setTimeout(() => document.querySelectorAll(".rv").forEach(el => el.classList.add("in")), 4000);
addEventListener("scroll", () => $("#nav").classList.toggle("solid", scrollY > 10), { passive: true });
})();
</script>
</body>
</html>
